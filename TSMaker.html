<!DOCTYPE html>
<html lang="ja">
<!-- v1.0.0 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試験</title>
</head>
<body>
  <h1>タイムスタンプ整形器</h1>
  <p>
    入力されたテキストを時間と内容に分割し、YouTubeのコメント欄に使用できる形式のタイムスタンプ用チャプターに変形します。<br>
    <span style="color:red">"総経過秒数:内容"</span>の形で入力してください。不正値は弾かれます。
  </p>
  <h3>整形前テキスト</h3>
  <textarea id="InputText" rows="20" cols="60"></textarea>
  <button id="Do">変換する</button>
  <h3>整形後タイムスタンプ</h3>
  <textarea readonly id="OutputText" rows="20" cols="60"></textarea>
  <script src="TSWorker.js"></script>
</body>
</html>
